services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: taskbot
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taskbot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskbot -d taskbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports": banco só acessível pela rede interna do compose (não exposto na VM).

  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      # Sobrepõe o DATABASE_URL do .env: dentro do compose o banco é o serviço "db".
      DATABASE_URL: postgresql://taskbot:${POSTGRES_PASSWORD}@db:5432/taskbot?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskbot_db_data:
